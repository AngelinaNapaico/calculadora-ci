services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    image: calculadora-ci/jenkins:1.0.0
    container_name: calculadora-jenkins
    restart: unless-stopped

    ports:
      - "${JENKINS_PORT:-8080}:8080"

    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false -Duser.timezone=America/Lima"
      # Incoming Webhook de Slack (viene del archivo .env)
      SLACK_WEBHOOK_URL: "${SLACK_WEBHOOK_URL:-}"

    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  jenkins_home: